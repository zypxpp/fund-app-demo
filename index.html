<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>基金交易 · 可交互原型</title>
  <meta name="description" content="基金交易 App 可交互原型">
  <style>
/* ============================================================
   基金交易 App 可交互原型
   Design tokens & application shell
   ============================================================ */
:root {
  --bg: #f6f7f9;
  --bg-soft: #f0f2f5;
  --card: #ffffff;
  --ink: #161b26;
  --ink-2: #3a4150;
  --muted: #8b93a1;
  --muted-2: #aeb4bf;
  --line: #edf0f4;
  --line-strong: #e3e7ed;
  --gold: #c8942b;
  --gold-deep: #a77917;
  --gold-light: #f0cf7b;
  --gold-soft: #fbf5e6;
  --navy: #1c2a44;
  --navy-2: #273955;
  --blue: #2f6bd8;
  --blue-soft: #edf3ff;
  --up: #0c9f6e;
  --up-soft: #e9f8f2;
  --down: #df5361;
  --down-soft: #fdf0f1;
  --amber: #c58b0d;
  --shadow-sm: 0 2px 10px rgba(25, 33, 48, 0.04);
  --shadow-md: 0 12px 30px rgba(25, 33, 48, 0.07);
  --shadow-lg: 0 32px 80px rgba(15, 23, 36, 0.22);
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 20px;
  --r-xl: 26px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  height: 100%;
}

body {
  margin: 0;
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(circle at 14% 18%, rgba(218, 181, 100, 0.16), transparent 30%),
    radial-gradient(circle at 86% 82%, rgba(41, 71, 116, 0.14), transparent 32%),
    #eaedf2;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

button,
input,
select,
textarea {
  font-family: inherit;
  color: inherit;
}

button {
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

svg {
  display: block;
}

::-webkit-scrollbar {
  width: 0;
  height: 0;
}

/* ---------- presentation stage ---------- */
.stage {
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(44px, 7vw, 104px);
  padding: 26px clamp(20px, 4vw, 58px);
  position: relative;
  overflow: clip;
}

.stage::before,
.stage::after {
  content: "";
  position: absolute;
  border-radius: 999px;
  filter: blur(2px);
  pointer-events: none;
}

.stage::before {
  width: 520px;
  height: 520px;
  left: -190px;
  bottom: -230px;
  border: 1px solid rgba(164, 124, 33, 0.16);
  box-shadow: 0 0 0 64px rgba(255, 255, 255, 0.16),
    0 0 0 128px rgba(255, 255, 255, 0.1);
}

.stage::after {
  width: 340px;
  height: 340px;
  right: -110px;
  top: -130px;
  border: 1px solid rgba(30, 52, 86, 0.12);
  box-shadow: 0 0 0 52px rgba(255, 255, 255, 0.12);
}

.stage-intro {
  width: 366px;
  position: relative;
  z-index: 1;
  flex: none;
}

.intro-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #4a5362;
  font-size: 11px;
  letter-spacing: 0.22em;
  font-weight: 700;
}

.intro-kicker {
  margin: 38px 0 14px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.15em;
  color: var(--gold-deep);
}

.stage-intro h1 {
  margin: 0;
  font-family: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
  font-size: clamp(42px, 4.1vw, 58px);
  line-height: 1.18;
  letter-spacing: -0.03em;
  font-weight: 600;
  color: #1a2231;
}

.intro-copy {
  margin: 24px 0 0;
  max-width: 340px;
  font-size: 14px;
  line-height: 1.9;
  color: #697282;
}

.intro-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 27px;
}

.intro-meta span {
  font-size: 11px;
  color: #5b6472;
  padding: 7px 10px;
  border: 1px solid rgba(39, 55, 80, 0.13);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.38);
}

.intro-note {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 46px;
  font-size: 12px;
  color: #7a8290;
}

.pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 0 0 rgba(200, 148, 43, 0.5);
  animation: pulse 2.2s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(200, 148, 43, 0.45); }
  70% { box-shadow: 0 0 0 9px rgba(200, 148, 43, 0); }
  100% { box-shadow: 0 0 0 0 rgba(200, 148, 43, 0); }
}

/* ---------- device ---------- */
.device-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  z-index: 2;
}

.device {
  width: 416px;
  height: min(884px, calc(100dvh - 40px));
  border-radius: 48px;
  background: #0e1117;
  padding: 8px;
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.25) inset,
    0 38px 100px rgba(18, 25, 38, 0.32),
    0 10px 30px rgba(18, 25, 38, 0.18);
  position: relative;
}

.device::after {
  content: "";
  position: absolute;
  inset: 3px;
  border-radius: 45px;
  border: 1px solid rgba(255, 255, 255, 0.13);
  pointer-events: none;
}

.device-island {
  position: absolute;
  z-index: 60;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  width: 92px;
  height: 25px;
  border-radius: 999px;
  background: #090b0f;
  pointer-events: none;
}

.device-caption {
  margin: 15px 0 0;
  font-size: 10.5px;
  letter-spacing: 0.02em;
  color: #7c8492;
  text-align: center;
}

.device-caption span {
  display: block;
  margin-top: 4px;
  color: #99a0ab;
}

.app {
  width: 100%;
  height: 100%;
  border-radius: 40px;
  overflow: hidden;
  background: var(--bg);
  position: relative;
  display: flex;
  flex-direction: column;
  isolation: isolate;
}

/* ---------- status bar ---------- */
.statusbar {
  flex: none;
  height: 48px;
  padding: 14px 25px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: #171b24;
  background: var(--bg);
  position: relative;
  z-index: 30;
  font-size: 13px;
  font-weight: 650;
  letter-spacing: 0.01em;
}

.statusbar-time {
  min-width: 54px;
  font-variant-numeric: tabular-nums;
}

.statusbar-icons {
  display: flex;
  align-items: center;
  gap: 5px;
}

.statusbar-icons svg {
  height: 12px;
  width: auto;
}

/* ---------- scrolling view ---------- */
.viewport {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  scroll-behavior: smooth;
  position: relative;
}

.page {
  min-height: 100%;
  padding-bottom: 22px;
  animation: page-in 0.32s cubic-bezier(0.22, 0.75, 0.25, 1);
}

.page--with-nav {
  padding-bottom: 10px;
}

@keyframes page-in {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.content {
  padding: 0 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.content--flush {
  padding: 0;
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.mt-6 { margin-top: 6px; }
.mt-10 { margin-top: 10px; }
.mt-14 { margin-top: 14px; }
.mt-18 { margin-top: 18px; }
.mb-10 { margin-bottom: 10px; }
.hidden { display: none !important; }

/* ---------- top bars ---------- */
.topbar {
  height: 56px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 17px;
  flex: none;
}

.topbar--sticky {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(246, 247, 249, 0.93);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.brand-name {
  font-size: 19px;
  font-weight: 750;
  letter-spacing: -0.02em;
}

.brand-name small {
  font-size: 10px;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: 0.06em;
  margin-left: 6px;
}

.top-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 18px;
}

.icon-btn {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  color: #252b36;
  border-radius: 50%;
  position: relative;
  transition: background 0.18s ease, transform 0.18s ease;
}

.icon-btn:active {
  transform: scale(0.92);
  background: rgba(20, 27, 40, 0.06);
}

.icon-btn svg {
  width: 22px;
  height: 22px;
}

.icon-btn .dot {
  position: absolute;
  width: 6px;
  height: 6px;
  background: #e45b61;
  border-radius: 50%;
  top: 2px;
  right: 2px;
  box-shadow: 0 0 0 2px var(--bg);
}

.detail-bar {
  height: 54px;
  display: flex;
  align-items: center;
  padding: 0 10px 0 8px;
  gap: 4px;
  position: sticky;
  top: 0;
  z-index: 22;
  background: rgba(246, 247, 249, 0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.detail-bar--white {
  background: rgba(255, 255, 255, 0.94);
}

.detail-bar .back {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: #202634;
}

.detail-bar .back:active {
  background: rgba(20, 27, 40, 0.06);
}

.detail-bar .back svg {
  width: 23px;
  height: 23px;
}

.detail-title {
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -0.01em;
  text-align: center;
  flex: 1;
  padding-right: 40px;
}

.detail-action {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
  padding: 7px 5px;
}

.detail-action--gold {
  color: var(--gold-deep);
  font-weight: 600;
}

/* ---------- typography bits ---------- */
.num {
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
}

.up { color: var(--up) !important; }
.down { color: var(--down) !important; }
.muted { color: var(--muted); }
.small { font-size: 11px; }

.eyebrow {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-transform: uppercase;
}

.section-card {
  background: var(--card);
  border-radius: var(--r-lg);
  padding: 17px 16px;
  box-shadow: var(--shadow-sm);
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.section-head h2 {
  margin: 0;
  font-size: 17px;
  line-height: 1.35;
  font-weight: 700;
  letter-spacing: -0.015em;
}

.section-head h2 span {
  color: var(--muted);
  font-weight: 500;
  font-size: 12px;
  margin-left: 5px;
  letter-spacing: 0;
}

.section-link {
  color: var(--muted);
  font-size: 11.5px;
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 4px 0;
}

.section-link svg {
  width: 14px;
  height: 14px;
}

/* ---------- buttons / chips ---------- */
.btn {
  min-height: 48px;
  border-radius: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 15px;
  font-weight: 650;
  transition: transform 0.16s ease, filter 0.16s ease, background 0.16s ease;
}

.btn:active {
  transform: scale(0.985);
}

.btn--primary {
  background: var(--navy);
  color: #fff;
  box-shadow: 0 8px 20px rgba(28, 42, 68, 0.16);
}

.btn--gold {
  background: linear-gradient(135deg, #d7a93d, #bd8920);
  color: #fff;
  box-shadow: 0 9px 24px rgba(183, 132, 23, 0.22);
}

.btn--ghost {
  background: #fff;
  border: 1px solid var(--line-strong);
  color: var(--ink-2);
  box-shadow: none;
}

.btn--soft {
  background: var(--gold-soft);
  color: var(--gold-deep);
  border: 1px solid rgba(200, 148, 43, 0.15);
}

.btn--wide {
  width: 100%;
}

.btn:disabled {
  opacity: 0.45;
  pointer-events: none;
}

.btn-sm {
  min-height: 34px;
  border-radius: 10px;
  padding: 0 13px;
  font-size: 12px;
  font-weight: 600;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 12px;
  background: #f1f3f6;
  color: #626b7a;
  white-space: nowrap;
  transition: background 0.18s ease, color 0.18s ease;
}

.chip--active {
  background: var(--gold-soft);
  color: var(--gold-deep);
  font-weight: 650;
}

.chip--navy {
  background: var(--navy);
  color: #fff;
}

.tag {
  display: inline-flex;
  align-items: center;
  height: 18px;
  border: 1px solid #dde2e9;
  color: #7e8795;
  border-radius: 4px;
  padding: 0 5px;
  font-size: 9.5px;
  line-height: 1;
  white-space: nowrap;
}

.tag--gold {
  border-color: rgba(200, 148, 43, 0.28);
  color: var(--gold-deep);
  background: #fdf9ef;
}

.tag--green {
  border-color: rgba(12, 159, 110, 0.22);
  color: var(--up);
  background: #f3fbf8;
}

.tag--blue {
  border-color: rgba(47, 107, 216, 0.2);
  color: var(--blue);
  background: #f4f8ff;
}

/* ============================================================
   HOME
   ============================================================ */
.home-topbar {
  height: 57px;
}

.overview-card {
  background: #fff;
  border-radius: var(--r-lg);
  padding: 16px 17px 15px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}

.overview-card::before {
  content: "";
  position: absolute;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  right: -100px;
  top: -110px;
  background: radial-gradient(circle, rgba(223, 181, 87, 0.16), transparent 68%);
  pointer-events: none;
}

.ov-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--muted);
  font-size: 12px;
  position: relative;
}

.ov-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.ov-label svg {
  width: 14px;
  height: 14px;
}

.ov-link {
  font-size: 11px;
  color: var(--muted);
  display: inline-flex;
  align-items: center;
  gap: 1px;
}

.ov-link svg {
  width: 13px;
  height: 13px;
}

.ov-value {
  margin-top: 7px;
  font-size: 31px;
  line-height: 1.15;
  font-weight: 720;
  letter-spacing: -0.035em;
  font-variant-numeric: tabular-nums;
}

.ov-value .currency {
  font-size: 12px;
  color: var(--muted);
  font-weight: 500;
  letter-spacing: 0;
  margin-left: 4px;
}

.ov-foot {
  margin-top: 12px;
  padding-top: 11px;
  border-top: 1px dashed var(--line);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.ov-foot-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.ov-foot-item span {
  color: var(--muted);
  font-size: 10.5px;
}

.ov-foot-item strong {
  font-size: 13px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.hero-quick {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  background: #fff;
  padding: 16px 7px 14px;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
}

.quick-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: #4c5564;
  font-size: 11px;
  line-height: 1;
  white-space: nowrap;
}

.quick-item:active .quick-icon {
  transform: translateY(1px) scale(0.95);
}

.quick-icon {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: var(--gold-deep);
  background: linear-gradient(180deg, #fffdf8, #fbf5e6);
  border: 1px solid rgba(200, 148, 43, 0.14);
  transition: transform 0.18s ease;
}

.quick-icon svg {
  width: 22px;
  height: 22px;
}

.quick-icon--plain {
  background: #f7f8fa;
  border-color: #eef1f4;
  color: #6e7684;
}

.quick-item--dark .quick-icon {
  background: var(--navy);
  color: #f4d486;
  border-color: var(--navy);
}

/* promo */
.promo {
  height: 160px;
  border-radius: var(--r-lg);
  overflow: hidden;
  position: relative;
  background:
    linear-gradient(106deg, rgba(13, 32, 57, 0.96) 0%, rgba(14, 48, 79, 0.9) 48%, rgba(41, 102, 137, 0.65) 100%),
    linear-gradient(150deg, #23425d, #6aa5c2);
  box-shadow: 0 12px 30px rgba(26, 48, 73, 0.16);
  color: #fff;
  padding: 20px 18px;
  isolation: isolate;
}

.promo::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 79% 22%, rgba(255, 220, 150, 0.28), transparent 29%),
    linear-gradient(90deg, transparent 55%, rgba(255, 255, 255, 0.08));
  z-index: -1;
}

.promo-skyline {
  position: absolute;
  right: -4px;
  bottom: 0;
  width: 57%;
  height: 78%;
  opacity: 0.55;
  z-index: -1;
}

.promo-kicker {
  font-size: 9px;
  letter-spacing: 0.18em;
  color: rgba(255, 255, 255, 0.62);
  font-weight: 600;
}

.promo h3 {
  margin: 8px 0 5px;
  font-family: "Songti SC", "STSong", serif;
  font-size: 24px;
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.promo p {
  margin: 0;
  font-size: 10.5px;
  color: rgba(255, 255, 255, 0.72);
  letter-spacing: 0.03em;
}

.promo-cta {
  position: absolute;
  left: 18px;
  bottom: 17px;
  font-size: 10.5px;
  color: #f4d99b;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.promo-cta svg {
  width: 13px;
  height: 13px;
}

.promo-dots {
  position: absolute;
  right: 16px;
  bottom: 14px;
  display: flex;
  gap: 5px;
}

.promo-dots i {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.34);
}

.promo-dots i.on {
  width: 12px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.86);
}

/* home fund cards */
.home-product {
  background: #f8f9fb;
  border: 1px solid #f0f2f5;
  border-radius: var(--r-md);
  padding: 13px 13px 12px;
}

.home-product + .home-product {
  margin-top: 9px;
}

.product-head {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.fund-badge {
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  flex: none;
  letter-spacing: -0.05em;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
}

.fund-badge--gold { background: linear-gradient(140deg, #d8ae4f, #a9791a); }
.fund-badge--navy { background: linear-gradient(140deg, #344d70, #1c2b45); }
.fund-badge--green { background: linear-gradient(140deg, #33a17d, #16775a); }
.fund-badge--blue { background: linear-gradient(140deg, #4f86c9, #2c5f9d); }
.fund-badge--red { background: linear-gradient(140deg, #d27676, #a9464e); }
.fund-badge--ink { background: linear-gradient(140deg, #585f6d, #252a34); }

.product-title {
  flex: 1;
  min-width: 0;
  padding-top: 1px;
}

.product-title h3 {
  margin: 0;
  font-size: 14px;
  line-height: 1.38;
  font-weight: 650;
  letter-spacing: -0.01em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.product-title p {
  margin: 4px 0 0;
  font-size: 9.5px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 4px;
  flex-wrap: wrap;
}

.product-code {
  color: #9ca4b1;
  font-family: "SF Mono", "Menlo", monospace;
  font-size: 9px;
}

.product-arrow {
  color: #c3c8d0;
  margin-top: 6px;
}

.product-arrow svg {
  width: 15px;
  height: 15px;
}

.product-metrics {
  display: grid;
  grid-template-columns: 1.1fr 1fr 1fr;
  gap: 6px;
  margin-top: 13px;
}

.metric {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}

.metric strong {
  font-size: 15px;
  font-weight: 660;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.metric span {
  font-size: 9.5px;
  color: var(--muted);
  white-space: nowrap;
}

.product-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 11px;
  padding-top: 10px;
  border-top: 1px dashed var(--line-strong);
}

.product-note {
  font-size: 9.5px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 5px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.product-note i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
  flex: none;
}

/* small fund rows */
.fund-row {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}

.fund-row:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}

.fund-row:first-child {
  padding-top: 0;
}

.fund-row .product-title p {
  margin-top: 3px;
}

.fund-row .row-return {
  text-align: right;
  flex: none;
}

.fund-row .row-return strong {
  display: block;
  font-size: 14px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.fund-row .row-return span {
  font-size: 9.5px;
  color: var(--muted);
}

.fund-row-list {
  border-radius: var(--r-md);
  overflow: hidden;
}

.watch-btn {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  color: #b9c0ca;
  border-radius: 50%;
  flex: none;
}

.watch-btn.is-on {
  color: var(--gold);
}

.watch-btn svg {
  width: 19px;
  height: 19px;
}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
.bottom-nav {
  flex: none;
  height: 74px;
  padding: 7px 12px max(7px, env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.96);
  border-top: 1px solid rgba(226, 230, 236, 0.75);
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  position: relative;
  z-index: 40;
}

.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  color: #959ca7;
  font-size: 10px;
  line-height: 1;
  transition: color 0.18s ease;
}

.nav-item svg {
  width: 23px;
  height: 23px;
  transition: transform 0.18s ease;
}

.nav-item:active svg {
  transform: scale(0.92);
}

.nav-item.is-active {
  color: #1b2639;
  font-weight: 600;
}

.nav-item.is-active > svg {
  color: #1b2639;
}

.nav-item.is-active .nav-symbol svg {
  color: #fff;
}

.nav-item.is-active .nav-symbol {
  background: #1b2639;
  color: #fff;
}

.nav-symbol {
  width: 31px;
  height: 26px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  transition: background 0.2s ease, color 0.2s ease;
}

.nav-symbol svg {
  width: 21px;
  height: 21px;
}

/* ============================================================
   NEWS
   ============================================================ */
.news-title-row {
  display: flex;
  align-items: baseline;
  gap: 13px;
  padding: 2px 17px 0;
}

.news-title-row h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 750;
  letter-spacing: -0.03em;
}

.news-title-row .sub {
  font-size: 11px;
  color: var(--gold-deep);
  font-weight: 600;
}

.news-tabs {
  display: flex;
  gap: 24px;
  overflow-x: auto;
  padding: 18px 17px 11px;
  position: sticky;
  top: 0;
  z-index: 19;
  background: rgba(246, 247, 249, 0.96);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.news-tab {
  font-size: 15px;
  color: #69717f;
  white-space: nowrap;
  position: relative;
  padding-bottom: 7px;
  transition: color 0.2s ease;
}

.news-tab.is-active {
  color: var(--ink);
  font-weight: 700;
}

.news-tab.is-active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 18px;
  height: 3px;
  border-radius: 3px;
  background: var(--gold);
}

.news-filter-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 2px 16px 12px;
  overflow-x: auto;
}

.news-date {
  font-size: 17px;
  font-weight: 700;
  margin-right: 4px;
}

.news-filter-row .chip {
  padding: 7px 13px;
}

.news-feed {
  margin: 0 12px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 4px 16px;
  box-shadow: var(--shadow-sm);
}

.news-item {
  display: flex;
  gap: 12px;
  padding: 16px 0;
  border-bottom: 1px solid var(--line);
  position: relative;
}

.news-item:last-child {
  border-bottom: 0;
}

.news-rail {
  width: 13px;
  flex: none;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 5px;
}

.news-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--gold);
  flex: none;
  box-shadow: 0 0 0 3px #fdf8ea;
}

.news-rail::after {
  content: "";
  width: 1px;
  flex: 1;
  margin-top: 6px;
  background: linear-gradient(#efe3c4, transparent);
}

.news-item:last-child .news-rail::after {
  display: none;
}

.news-main {
  flex: 1;
  min-width: 0;
}

.news-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  color: var(--muted);
  font-size: 10.5px;
}

.news-meta .share {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: #a0a7b2;
}

.news-meta .share svg {
  width: 13px;
  height: 13px;
}

.news-item h3 {
  margin: 8px 0 6px;
  font-size: 15px;
  line-height: 1.55;
  font-weight: 650;
  letter-spacing: -0.01em;
}

.news-item p {
  margin: 0;
  color: #878f9c;
  font-size: 11px;
  line-height: 1.7;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.news-stock {
  margin-top: 8px;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  color: var(--up);
  background: #f3fbf8;
  border-radius: 4px;
  padding: 4px 7px;
}

.news-more {
  margin: 4px 16px 0;
  color: var(--muted);
  font-size: 11px;
  text-align: center;
  padding: 14px;
}

.article-cover {
  height: 180px;
  margin: 0 16px;
  border-radius: var(--r-lg);
  overflow: hidden;
  position: relative;
  background:
    radial-gradient(circle at 78% 20%, rgba(255, 215, 137, 0.3), transparent 30%),
    linear-gradient(130deg, #172a44, #34617d 65%, #8baeae);
  color: #fff;
  padding: 22px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

.article-cover::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
  background-size: 34px 34px;
  mask-image: linear-gradient(transparent, #000);
  opacity: 0.5;
}

.article-cover span {
  position: relative;
  z-index: 1;
  font-size: 10px;
  letter-spacing: 0.16em;
  color: rgba(255, 255, 255, 0.6);
}

.article-cover h2 {
  position: relative;
  z-index: 1;
  margin: 8px 0 0;
  font-size: 21px;
  line-height: 1.38;
  font-weight: 600;
  letter-spacing: 0.01em;
}

.article-body {
  padding: 20px 22px 8px;
}

.article-body .article-meta {
  display: flex;
  gap: 12px;
  color: var(--muted);
  font-size: 10.5px;
  margin-bottom: 18px;
}

.article-body p {
  margin: 0 0 16px;
  font-size: 14px;
  line-height: 1.95;
  color: #3b4351;
}

.article-body p.lead {
  font-size: 14.5px;
  color: #252d3a;
}

.article-quote {
  margin: 4px 0 18px;
  border-left: 2px solid var(--gold);
  padding: 2px 0 2px 14px;
  color: #707988;
  font-size: 12.5px;
  line-height: 1.8;
}

.article-stock-card {
  margin: 2px 0 20px;
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #fafbfc;
}

.article-stock-card strong {
  font-size: 13px;
}

.article-stock-card span {
  font-size: 12px;
  color: var(--up);
}

.article-footer {
  padding: 0 22px 20px;
  color: #9aa1ad;
  font-size: 10px;
  line-height: 1.7;
}

/* ============================================================
   PRODUCTS
   ============================================================ */
.product-tabs {
  display: flex;
  gap: 26px;
  overflow-x: auto;
  padding: 4px 17px 12px;
  align-items: flex-end;
  position: sticky;
  top: 0;
  z-index: 24;
  background: rgba(246, 247, 249, 0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

.product-tab {
  font-size: 15px;
  color: #6e7684;
  white-space: nowrap;
  padding: 5px 0 7px;
  position: relative;
}

.product-tab.is-active {
  color: var(--ink);
  font-weight: 700;
}

.product-tab.is-active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: 20px;
  height: 3px;
  border-radius: 4px;
  background: var(--gold);
}

.filter-row {
  display: flex;
  gap: 7px;
  padding: 0 16px 12px;
  overflow-x: auto;
}

.filter-select {
  height: 30px;
  padding: 0 11px;
  border-radius: 999px;
  background: #eef1f5;
  color: #6e7684;
  font-size: 10.5px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  white-space: nowrap;
}

.filter-select svg {
  width: 11px;
  height: 11px;
  opacity: 0.7;
}

.indices-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 0 16px;
}

.index-mini {
  background: #fff;
  border-radius: 14px;
  padding: 11px 10px 9px;
  box-shadow: var(--shadow-sm);
  min-width: 0;
}

.index-mini .name {
  font-size: 10px;
  color: #606977;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.index-mini .name span {
  font-size: 7px;
  color: var(--gold-deep);
  border: 1px solid rgba(200, 148, 43, 0.25);
  border-radius: 2px;
  padding: 1px 2px;
  flex: none;
}

.index-mini .val {
  font-size: 15px;
  font-weight: 700;
  margin-top: 5px;
  font-variant-numeric: tabular-nums;
}

.index-mini .chg {
  font-size: 9px;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

.index-mini svg.spark {
  width: 100%;
  height: 28px;
  margin-top: 4px;
}

.market-section {
  margin: 12px 16px 0;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 15px;
  box-shadow: var(--shadow-sm);
}

.market-section .section-head {
  margin-bottom: 9px;
}

.market-tools {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  margin: 12px 16px 0;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 14px 4px 12px;
  box-shadow: var(--shadow-sm);
}

.market-tools .quick-item {
  font-size: 9.5px;
  gap: 7px;
}

.market-tools .quick-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
}

.market-tools .quick-icon svg {
  width: 18px;
  height: 18px;
}

.mover-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}

.mover-row:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}

.mover-name {
  font-size: 12.5px;
  font-weight: 550;
  display: flex;
  align-items: center;
  gap: 5px;
}

.mover-name .code {
  color: #a3aab5;
  font-size: 9px;
  font-weight: 400;
  font-family: "SF Mono", "Menlo", monospace;
}

.mover-price {
  text-align: right;
  flex: none;
  font-variant-numeric: tabular-nums;
}

.mover-price strong {
  display: block;
  font-size: 13px;
  font-weight: 650;
}

.mover-price span {
  font-size: 10px;
}

.index-banner {
  margin: 0 16px 12px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 15px;
  box-shadow: var(--shadow-sm);
}

.index-banner .big-index {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
}

.index-banner .big-index .name {
  font-size: 13px;
  font-weight: 650;
}

.index-banner .big-index .value {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  margin-top: 5px;
}

.index-banner .big-index .chg {
  font-size: 12px;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

.index-banner svg.chart {
  width: 100%;
  height: 72px;
  margin-top: 7px;
}

/* public fund list */
.fund-list {
  margin: 0 16px;
  background: #fff;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.fund-list-head {
  display: grid;
  grid-template-columns: 1.7fr 0.8fr 0.7fr;
  gap: 6px;
  padding: 12px 14px;
  color: var(--muted);
  font-size: 9.5px;
  border-bottom: 1px solid var(--line);
  background: #fcfcfd;
}

.fund-list-head span:nth-child(n+2) {
  text-align: right;
}

.fund-list-row {
  display: grid;
  grid-template-columns: 1.7fr 0.8fr 0.7fr;
  gap: 6px;
  align-items: center;
  padding: 14px;
  border-bottom: 1px solid var(--line);
  transition: background 0.16s ease;
}

.fund-list-row:active {
  background: #fafbfc;
}

.fund-list-row:last-child {
  border-bottom: 0;
}

.fund-list-name {
  min-width: 0;
}

.fund-list-name strong {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.fund-list-name p {
  margin: 4px 0 0;
  display: flex;
  gap: 4px;
  align-items: center;
  flex-wrap: wrap;
}

.fund-list-num {
  text-align: right;
  font-size: 12.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.fund-list-num span {
  display: block;
  color: var(--muted);
  font-size: 9px;
  font-weight: 400;
  margin-top: 4px;
}

.product-empty {
  margin: 14px 16px 0;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 54px 20px;
  text-align: center;
  color: var(--muted);
  box-shadow: var(--shadow-sm);
}

.product-empty .empty-icon {
  width: 58px;
  height: 58px;
  margin: 0 auto 14px;
  border-radius: 20px;
  background: #f5f7fa;
  display: grid;
  place-items: center;
  color: #b9c0ca;
}

.product-empty .empty-icon svg {
  width: 27px;
  height: 27px;
}

.product-empty h3 {
  margin: 0 0 6px;
  color: #4b5462;
  font-size: 14px;
  font-weight: 600;
}

.product-empty p {
  margin: 0;
  font-size: 11px;
  line-height: 1.7;
}

.section-caption {
  font-size: 10px;
  color: #9ca3af;
  padding: 2px 4px 8px;
}

.structured-card {
  margin: 0 16px 10px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 15px;
  box-shadow: var(--shadow-sm);
}

.structured-card .top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.structured-card h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 650;
  line-height: 1.4;
}

.structured-card .code {
  margin-top: 5px;
  color: var(--muted);
  font-family: "SF Mono", "Menlo", monospace;
  font-size: 9px;
}

.structured-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--line);
}

.structured-metrics strong {
  font-size: 17px;
  font-weight: 700;
}

.structured-metrics span {
  font-size: 9px;
  color: var(--muted);
  display: block;
  margin-top: 3px;
}

/* watchlist empty */
.watchlist-hint {
  margin: 0 16px;
  background: linear-gradient(135deg, #fffaf0, #fff);
  border: 1px solid rgba(200, 148, 43, 0.14);
  border-radius: var(--r-lg);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.watchlist-hint .hint-icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  background: #fdf4dd;
  display: grid;
  place-items: center;
  color: var(--gold-deep);
  flex: none;
}

.watchlist-hint strong {
  display: block;
  font-size: 12.5px;
  margin-bottom: 3px;
}

.watchlist-hint p {
  margin: 0;
  font-size: 10.5px;
  color: var(--muted);
  line-height: 1.5;
}

/* ============================================================
   ACCOUNT
   ============================================================ */
.account-top {
  padding: 2px 17px 11px;
}

.account-kicker {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  color: var(--muted);
}

.account-kicker strong {
  color: #3e4756;
  font-size: 12px;
  font-weight: 650;
}

.virtual-pill {
  border: 1px solid var(--line-strong);
  border-radius: 999px;
  padding: 2px 7px;
  font-size: 8.5px;
  color: #858d9a;
}

.asset-hero {
  margin: 0 16px;
  border-radius: var(--r-xl);
  padding: 18px 18px 16px;
  background:
    radial-gradient(circle at 84% 0%, rgba(255, 238, 183, 0.24), transparent 35%),
    linear-gradient(133deg, #d7ad44 0%, #c89524 43%, #ac7c14 100%);
  color: #fff;
  box-shadow: 0 18px 38px rgba(155, 112, 17, 0.22);
  position: relative;
  overflow: hidden;
}

.asset-hero::after {
  content: "";
  position: absolute;
  width: 230px;
  height: 230px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.16);
  right: -125px;
  top: -125px;
  box-shadow: 0 0 0 32px rgba(255, 255, 255, 0.05),
    0 0 0 70px rgba(255, 255, 255, 0.04);
  pointer-events: none;
}

.asset-hero-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  position: relative;
  z-index: 1;
}

.asset-hero-label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  color: rgba(255, 255, 255, 0.76);
}

.asset-hero-label svg {
  width: 13px;

.quick-grid {

}

.quick-grid .quick-icon {

}

.quick-grid .quick-icon svg {
  width: 19px;
  height: 19px;
}

.account-tabs {

  align-items: center;
  gap: 19px;
  padding: 16px 17px 10px;
}

.account-tabs button {

}

.account-tabs button.is-active {

}

.account-tabs .count {

}

.account-tabs .edit-hold {

.account-tabs .edit-hold svg {

  height: 15px;
}

.account-group {

  padding: 14px;

}

.account-group-head {

  align-items: center;

}

.flag {

.flag--hk { background: linear-gradient(135deg, #c23b38, #a6232b); }
.flag--cn { background: linear-gradient(135deg, #d94a45, #be2a2a); }
.flag--us { background: linear-gradient(135deg, #4f70a8, #2b4774); }
.flag--fund { background: linear-gradient(135deg, #d1a540, #a27413); }
.flag--bond { background: linear-gradient(135deg, #4d9a80, #246a55); }

.account-group-head h3 {

  font-size: 13px;

}

.account-group-head .extra {

}

.account-group-head .chev {

}

.account-group-head .chev svg {

}

.account-group.is-collapsed .chev svg {

}

.account-group.is-collapsed .group-body {

}

.group-summary {

  justify-content: space-between;
  gap: 8px;

}

.group-summary .sum-label {

  color: var(--muted);
}

.group-summary .sum-val {

  margin-top: 3px;
  font-variant-numeric: tabular-nums;

}

.group-pnl {
  display: flex;
  gap: 14px;
  padding-bottom: 2px;
}

.group-pnl div {
  text-align: right;
}

.group-pnl span {
  display: block;
  color: var(--muted);
  font-size: 8.5px;
}

.group-pnl strong {
  display: block;
  font-size: 10.5px;
  margin-top: 3px;
  font-variant-numeric: tabular-nums;
}

.holding-table {

}

.holding-row {

.holding-row .name p {

  font-weight: 400;
}

.holding-row .cell {
  text-align: right;
  font-size: 10.5px;
  font-weight: 550;
  font-variant-numeric: tabular-nums;
}

.holding-row .cell span {
  display: block;
  margin-top: 4px;
  font-size: 8.5px;
  color: var(--muted);

}

.holding-row--head {
  padding: 0 0 7px;
  color: #a1a8b3;
  font-size: 8.5px;
}

.holding-row--head .cell {
  color: #a1a8b3;
  font-size: 8.5px;
  font-weight: 400;
}

.holding-table .fund-link {
  display: block;

}

.holding-note {
  margin-top: 9px;

  align-items: center;

}

.empty-hold {
  padding: 22px 0 10px;
  text-align: center;
  color: #b0b6c0;
  font-size: 10.5px;
}

.account-footer-note {
  text-align: center;
  font-size: 9px;
  color: #a6adb7;
  padding: 10px 0 2px;
}

/* ============================================================
   MINE
   ============================================================ */
.profile-card {

}

}

.profile-info {

.profile-info h2 {

.profile-info .profile-tags {

.profile-info .profile-tags .tag {

.profile-card .profile-edit {

.profile-card .profile-edit svg {

}

.mine-section {

.mine-section h3 {

.mine-row {

.mine-row .mine-icon {

.mine-row .mine-icon svg {

}

.mine-row .mine-chev {

.mine-row .mine-chev svg {

}

.mine-badge {

}

   FUND DETAIL
   ============================================================ */
.fund-detail-head {
  padding: 5px 17px 13px;
}

.fund-name-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.fund-name-row h1 {
  margin: 0;
  font-size: 21px;
  line-height: 1.4;
  font-weight: 700;
  letter-spacing: -0.025em;

}

.fund-name-row .watch-btn {
  margin-top: -4px;
}

.fund-code {

  margin-top: 5px;
  letter-spacing: 0.02em;
}

.fund-quote {
  margin-top: 19px;
  display: grid;
  grid-template-columns: 1.1fr 1.3fr;
  gap: 12px;
  align-items: end;
}

.fund-quote .q-label {
  font-size: 9.5px;
  color: var(--muted);
  margin-bottom: 5px;
}

.fund-quote .q-return {
  font-size: 26px;
  line-height: 1;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.fund-quote .q-nav {
  text-align: right;
  font-size: 22px;
  line-height: 1;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.fund-quote .q-nav small {
  display: block;
  font-size: 9px;
  color: var(--muted);
  font-weight: 400;
  margin-top: 6px;
}

.fund-tagline {
  display: flex;
  gap: 5px;
  margin-top: 13px;
  flex-wrap: wrap;
}

.seg-tabs {

  border-bottom: 1px solid var(--line);
  padding: 0 16px;
  gap: 30px;
  background: var(--bg);

}

.seg-tab.is-active {
  color: var(--ink);
  font-weight: 650;
}

.seg-tab.is-active::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -1px;
  width: 26px;
  height: 3px;
  border-radius: 3px;
  background: var(--gold);
  transform: translateX(-50%);
}

.chart-panel {
  margin: 0 16px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 14px 12px 10px;
  box-shadow: var(--shadow-sm);
}

.chart-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 3px 8px;
}

.chart-top .chart-label {
  font-size: 9.5px;
  color: var(--muted);
}

.chart-legend {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 8.5px;
  color: var(--muted);
}

.chart-legend i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold);
}

.big-chart {
  width: 100%;
  height: 156px;
  display: block;
}

.period-tabs {
  display: flex;
  gap: 3px;
  padding: 7px 0 0;
  border-top: 1px solid var(--line);
  margin-top: 4px;
}

.period-tab {
  flex: 1;
  padding: 6px 0;
  font-size: 9.5px;
  color: var(--muted);
  border-radius: 7px;
}

.period-tab.is-active {
  color: var(--gold-deep);
  background: var(--gold-soft);
  font-weight: 650;
}

.perf-table {
  margin: 0 16px;
  background: #fff;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: 4px 15px;
}

.perf-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}

.perf-row:last-child {
  border-bottom: 0;
}

.perf-row span:nth-child(n+2) {
  text-align: right;
}

.perf-row.head {
  color: var(--muted);
  font-size: 9.5px;
  padding: 10px 0;
}

.nav-table {
  margin: 0 16px;
  background: #fff;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  padding: 4px 15px;
}

.nav-row {
  display: grid;
  grid-template-columns: 1.1fr 1fr 0.8fr;
  gap: 8px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
  font-size: 11px;
  font-variant-numeric: tabular-nums;
}

.nav-row:last-child {
  border-bottom: 0;
}

.nav-row span:nth-child(n+2) {
  text-align: right;
}

.nav-row.head {
  color: var(--muted);
  font-size: 9.5px;
  padding: 10px 0;
}

.info-card {
  margin: 0 16px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}

.info-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.info-card .info-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.info-card h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 650;
}

.info-card .info-link {
  font-size: 10px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 2px;
}

.info-card .info-link svg {
  width: 12px;
  height: 12px;
}

.rule-timeline {
  display: flex;
  align-items: flex-start;
  margin: 19px 2px 4px;
  position: relative;
}

.rule-timeline::before {
  content: "";
  position: absolute;
  left: 4px;
  right: 4px;
  top: 5px;
  height: 1px;
  background: #dfe3e9;
}

.rule-step {
  flex: 1;
  position: relative;
  z-index: 1;
  text-align: center;
}

.rule-step i {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #fff;
  border: 1.5px solid #bfc5ce;
  display: block;
  margin: 0 auto 9px;
}

.rule-step.is-first i,
.rule-step.is-last i {
  border-color: var(--gold);
  background: var(--gold);
  box-shadow: 0 0 0 3px #fdf7e8;
}

.rule-step span {
  display: block;
  color: var(--muted);
  font-size: 8.5px;
}

.rule-step strong {
  display: block;
  font-size: 10px;
  font-weight: 600;
  margin-top: 3px;
}

.rule-fees {
  display: flex;
  justify-content: space-between;
  gap: 15px;
  padding-top: 13px;
  margin-top: 12px;
  border-top: 1px solid var(--line);
  font-size: 10.5px;
  color: var(--muted);
}

.rule-fees strong {
  color: var(--ink-2);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.fund-overview {
  margin: 0 16px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 0 16px;
  box-shadow: var(--shadow-sm);
}

.fund-accordion {
  border-bottom: 1px solid var(--line);
}

.fund-accordion:last-child {
  border-bottom: 0;
}

.fund-accordion summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 15px 0;
  font-size: 12.5px;
  font-weight: 550;
  cursor: pointer;
}

.fund-accordion summary::-webkit-details-marker {
  display: none;
}

.fund-accordion summary .chev {
  margin-left: auto;
  color: #b4bbc5;
  transition: transform 0.2s ease;
}

.fund-accordion[open] summary .chev {
  transform: rotate(90deg);
}

.fund-accordion summary .chev svg {
  width: 14px;
  height: 14px;
}

.fund-accordion .acc-body {
  padding: 0 0 14px;
  color: #7e8795;
  font-size: 10.5px;
  line-height: 1.8;
}

.manager-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.manager-avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, #e8d8b1, #b88f3c);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 650;
}

.risk-warning {
  background: #fbf6e9;
  border: 1px solid #f3e6c3;
  border-radius: 10px;
  padding: 10px;
  color: #8c722f;
  font-size: 9.5px;
  line-height: 1.7;
}

/* sticky action bar */
.actionbar {
  flex: none;
  background: rgba(255, 255, 255, 0.97);
  border-top: 1px solid var(--line);
  padding: 10px 14px max(10px, env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  gap: 10px;
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  position: relative;
  z-index: 35;
}

.actionbar .watch-large {
  width: 49px;
  height: 49px;
  border-radius: 13px;
  border: 1px solid var(--line-strong);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: #939aa6;
  font-size: 8px;
  flex: none;
}

.actionbar .watch-large svg {
  width: 19px;
  height: 19px;
}

.actionbar .watch-large.is-on {
  color: var(--gold);
  border-color: rgba(200, 148, 43, 0.3);
  background: #fffdf8;
}

.actionbar .btn {
  flex: 1;
  min-height: 49px;
}

.actionbar .btn.secondary {
  flex: 0 0 88px;
  background: #eef2f7;
  color: var(--navy);
  box-shadow: none;
}

   ============================================================ */

  box-shadow: var(--shadow-sm);

  align-items: center;
  justify-content: center;
  gap: 5px;
  font-size: 11.5px;
  color: #505968;
}

.order-filter svg {
  width: 12px;
  height: 12px;
  color: #9ba2ad;

.order-card {
  margin: 0 16px 10px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 15px;
  box-shadow: var(--shadow-sm);
}

.order-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding-bottom: 11px;
  border-bottom: 1px solid var(--line);
}

.order-type {
  font-size: 13px;
  font-weight: 650;
}

.order-status {
  font-size: 10.5px;
  color: var(--blue);
}

.order-status.done { color: var(--up); }
.order-status.cancelled { color: #a0a7b2; }

.order-lines {
  padding-top: 9px;
}

.order-line {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 4.5px 0;
  font-size: 10.5px;
  color: #8c94a0;
}

.order-line strong {
  color: #404856;
  font-weight: 550;
  font-variant-numeric: tabular-nums;
}

.order-empty {
  margin: 10px 16px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 60px 20px;
  text-align: center;
  color: var(--muted);
  box-shadow: var(--shadow-sm);
}

.order-empty .empty-icon {
  width: 58px;
  height: 58px;
  border-radius: 19px;
  margin: 0 auto 14px;
  background: #f6f8fa;
  display: grid;
  place-items: center;
  color: #b8bfc9;
}

.order-empty .empty-icon svg {
  width: 28px;
  height: 28px;
}

.order-empty h3 {
  margin: 0 0 6px;
  color: #4f5866;
  font-size: 14px;
}

.order-empty p {
  margin: 0;
  font-size: 11px;
}

.order-detail-hero {
  padding: 8px 18px 16px;
}

.order-detail-hero h2 {
  margin: 0;
  font-size: 19px;
  font-weight: 700;
}

.order-detail-hero .code {
  margin-top: 5px;
  font-family: "SF Mono", "Menlo", monospace;
  font-size: 10px;
  color: var(--muted);
}

.detail-list {
  margin: 0 16px 10px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 4px 15px;
  box-shadow: var(--shadow-sm);
}

.detail-list .row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
  font-size: 11.5px;
}

.detail-list .row:last-child {
  border-bottom: 0;
}

.detail-list .row span {
  color: #8b93a1;
  flex: none;
}

.detail-list .row strong {
  text-align: right;
  font-weight: 550;
  color: #333b49;
  font-variant-numeric: tabular-nums;
  word-break: break-all;
}

.status-banner {
  margin: 0 16px 10px;
  background: linear-gradient(135deg, #f0f7ff, #f8fbff);
  border: 1px solid #e3eefb;
  border-radius: var(--r-lg);
  padding: 14px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.status-banner .b-icon {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #e5f1ff;
  color: var(--blue);
  display: grid;
  place-items: center;
  flex: none;
}

.status-banner .b-icon svg {
  width: 15px;
  height: 15px;
}

.status-banner strong {
  display: block;
  font-size: 11.5px;
  color: #3c5470;
  margin-bottom: 3px;
}

.status-banner p {
  margin: 0;
  font-size: 9.5px;
  color: #8294a8;
  line-height: 1.6;
}

/* ============================================================
   SEARCH
   ============================================================ */
.search-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 16px 12px;
  background: #fff;
  border-radius: 12px;
  padding: 10px 12px;
  box-shadow: var(--shadow-sm);
}

.search-bar svg {
  width: 17px;
  height: 17px;
  color: #9da4af;
  flex: none;
}

.search-bar input {
  flex: 1;
  border: 0;
  outline: 0;
  background: transparent;
  font-size: 13px;
  min-width: 0;
}

.search-bar input::placeholder {
  color: #b2b8c1;
}

.search-cancel {
  font-size: 11.5px;
  color: var(--muted);
}

.search-block {
  padding: 0 16px;
}

.search-block h3 {
  margin: 13px 0 9px;
  font-size: 12px;
  color: #5e6775;
  font-weight: 650;
}

.search-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.search-tags .chip {
  background: #fff;
  box-shadow: var(--shadow-sm);
}

.search-result {
  margin: 0 16px;
  background: #fff;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

.search-result .fund-list-row {
  grid-template-columns: 1.9fr 1fr;
}

.search-result .fund-list-row .fund-list-num {
  font-size: 12px;
}

.recent-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}

.recent-row:last-child {
  border-bottom: 0;
}

.recent-row svg {
  width: 15px;
  height: 15px;
  color: #b3bac4;
}

.recent-row .clear {
  margin-left: auto;
  color: #b1b8c2;
  font-size: 10px;
}

/* ============================================================
   DEPOSIT / FORMS
   ============================================================ */
.stepper {
  display: flex;
  align-items: flex-start;
  margin: 5px 20px 18px;
  position: relative;
}

.stepper::before {
  content: "";
  position: absolute;
  left: 12px;
  right: 12px;
  top: 8px;
  height: 1px;
  background: #dfe3e9;
}

.step {
  flex: 1;
  text-align: center;
  position: relative;
  z-index: 1;
}

.step i {
  display: block;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #e8ebf0;
  border: 2px solid var(--bg);
  margin: 0 auto 7px;
  color: #fff;
  font-size: 8px;
  font-style: normal;
  line-height: 12px;
  font-weight: 600;
}

.step.is-active i {
  background: var(--navy);
  box-shadow: 0 0 0 3px #e6eaf0;
}

.step.is-done i {
  background: var(--gold);
}

.step span {
  font-size: 8.5px;
  color: #a2a9b4;
  white-space: nowrap;
}

.step.is-active span {
  color: var(--ink-2);
  font-weight: 600;
}

.panel {
  margin: 0 16px 11px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}

.panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 12.5px;
  font-weight: 650;
  margin-bottom: 12px;
}

.panel-title .hint {
  font-size: 9.5px;
  color: var(--muted);
  font-weight: 400;
}

.currency-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.currency-card {
  border: 1px solid var(--line-strong);
  border-radius: 12px;
  padding: 12px 9px;
  text-align: left;
  background: #fcfcfd;
  transition: border 0.18s ease, background 0.18s ease;
}

.currency-card.is-active {
  border-color: var(--gold);
  background: #fffbf1;
  box-shadow: inset 0 0 0 1px rgba(200, 148, 43, 0.15);
}

.currency-card .cur-head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 650;
}

.currency-card .cur-head i {
  width: 21px;
  height: 21px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 8px;
  font-weight: 700;
  font-style: normal;
  color: #fff;
}

.currency-card span {
  font-size: 9px;
  color: var(--muted);
  display: block;
  margin-top: 6px;
}

.amount-box {
  border-bottom: 1px solid var(--line);
  padding: 0 1px 11px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.amount-box .currency-symbol {
  font-size: 22px;
  font-weight: 600;
  color: #4b5563;
}

.amount-box input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: 0;
  font-size: 29px;
  font-weight: 650;
  letter-spacing: -0.03em;
  background: transparent;
}

.amount-box input::placeholder {
  color: #cbd0d8;
  font-weight: 400;
}

.amount-box .all {
  font-size: 10px;
  color: var(--gold-deep);
  white-space: nowrap;
}

.amount-hint {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
  font-size: 9px;
  color: var(--muted);
}

.quick-amounts {
  display: flex;
  gap: 7px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.bank-card {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
}

.bank-card:first-of-type {
  border-top: 0;
}

.bank-logo {
  width: 34px;
  height: 34px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  background: linear-gradient(135deg, #c4393d, #8f1f2a);
  flex: none;
}

.bank-logo--blue { background: linear-gradient(135deg, #3e6ca8, #1e477b); }
.bank-logo--gold { background: linear-gradient(135deg, #d1a23b, #9e7117); }
.bank-logo--green { background: linear-gradient(135deg, #3f997b, #1f6b53); }

.bank-info {
  min-width: 0;
  flex: 1;
}

.bank-info strong {
  display: block;
  font-size: 11.5px;
  font-weight: 600;
}

.bank-info span {
  display: block;
  margin-top: 3px;
  font-size: 9.5px;
  color: var(--muted);
}

.copy-btn {
  font-size: 9.5px;
  color: var(--gold-deep);
  padding: 5px 8px;
  border-radius: 7px;
  background: var(--gold-soft);
}

.radio-line {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 10px;
  color: #8b93a1;
  line-height: 1.6;
}

.radio-line svg {
  width: 14px;
  height: 14px;
  flex: none;
  margin-top: 1px;
  color: var(--gold-deep);
}

.radio-line strong {
  color: var(--gold-deep);
}

.notice-line {
  margin: 0 16px 12px;
  padding: 11px 12px;
  background: #fbf6e9;
  border: 1px solid #f2e4c1;
  border-radius: 11px;
  color: #8b7338;
  font-size: 9.5px;
  line-height: 1.7;
}

.form-actions {
  padding: 4px 16px 18px;
}

.exchange-rate {
  margin-top: 12px;
  background: #fafbfc;
  border-radius: 11px;
  padding: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10px;
  color: var(--muted);
}

.exchange-rate strong {
  color: var(--ink-2);
  font-weight: 600;
}

.exchange-switch {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: #fff;
  box-shadow: var(--shadow-sm);
  display: grid;
  place-items: center;
  color: var(--gold-deep);
  position: relative;
  z-index: 2;
  margin: -21px auto -13px;
  border: 1px solid var(--line);
}

.exchange-switch svg {
  width: 17px;
  height: 17px;
}

.currency-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.currency-row:last-child {
  border-bottom: 0;
}

.currency-row .big-flag {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 13px;
  background: #f5f6f8;
}

/* ============================================================
   RISK / ANALYSIS
   ============================================================ */
.risk-intro {
  margin: 0 16px;
  background:
    radial-gradient(circle at 82% 8%, rgba(240, 207, 123, 0.22), transparent 32%),
    linear-gradient(145deg, #1b2d47, #2f4e70);
  border-radius: var(--r-xl);
  padding: 22px 20px;
  color: #fff;
  box-shadow: 0 18px 40px rgba(23, 41, 67, 0.18);
}

.risk-intro .shield {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.1);
  display: grid;
  place-items: center;
  color: #f1d48d;
  margin-bottom: 18px;
}

.risk-intro .shield svg {
  width: 25px;
  height: 25px;
}

.risk-intro h2 {
  margin: 0;
  font-family: "Songti SC", "STSong", serif;
  font-size: 26px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.risk-intro p {
  margin: 9px 0 0;
  font-size: 11px;
  line-height: 1.8;
  color: rgba(255, 255, 255, 0.64);
}

.risk-progress {
  margin: 16px 16px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.risk-progress .bar {
  flex: 1;
  height: 4px;
  border-radius: 99px;
  background: #e3e7ed;
  overflow: hidden;
}

.risk-progress .bar i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, #d2a338, #bb8619);
  transition: width 0.3s ease;
}

.risk-progress span {
  font-size: 9.5px;
  color: var(--muted);
}

.question-card {
  margin: 0 16px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}

.question-index {
  font-size: 9px;
  color: var(--gold-deep);
  letter-spacing: 0.1em;
  font-weight: 650;
}

.question-card h3 {
  margin: 8px 0 16px;
  font-size: 16px;
  line-height: 1.5;
  font-weight: 650;
}

.risk-option {
  width: 100%;
  text-align: left;
  padding: 13px 14px;
  border: 1px solid var(--line-strong);
  border-radius: 11px;
  margin-bottom: 9px;
  font-size: 11.5px;
  color: #596271;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: border 0.18s ease, background 0.18s ease;
}

.risk-option i {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 1px solid #cbd1d9;
  flex: none;
  display: grid;
  place-items: center;
}

.risk-option.is-selected {
  border-color: var(--gold);
  background: #fffcf3;
  color: var(--ink);
}

.risk-option.is-selected i {
  border-color: var(--gold);
  background: var(--gold);
  box-shadow: inset 0 0 0 3px #fff;
}

.risk-result-card {
  margin: 0 16px;
  background: #fff;
  border-radius: var(--r-xl);
  padding: 28px 20px 22px;
  box-shadow: var(--shadow-sm);
  text-align: center;
}

.risk-result-badge {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  margin: 0 auto 16px;
  background:
    radial-gradient(circle at 50% 40%, #fffaf0, #f4dfad);
  border: 1px solid #eed89f;
  display: grid;
  place-items: center;
  color: var(--gold-deep);
  position: relative;
}

.risk-result-badge::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px dashed rgba(169, 121, 23, 0.35);
  border-radius: 50%;
}

.risk-result-badge svg {
  width: 32px;
  height: 32px;
}

.risk-result-card .eyebrow {
  color: var(--gold-deep);
}

.risk-result-card h2 {
  margin: 8px 0 8px;
  font-size: 27px;
  font-family: "Songti SC", "STSong", serif;
  font-weight: 600;
  color: #263142;
}

.risk-result-card p {
  margin: 0 auto;
  max-width: 285px;
  font-size: 11px;
  line-height: 1.85;
  color: var(--muted);
}

.risk-result-scale {
  display: flex;
  gap: 5px;
  margin: 22px 4px 18px;
}

.risk-result-scale i {
  flex: 1;
  height: 5px;
  border-radius: 99px;
  background: #e9edf2;
}

.risk-result-scale i.on {
  background: linear-gradient(90deg, #d3a63d, #bc881b);
}

.result-info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  text-align: left;
  margin-top: 17px;
}

.result-info div {
  background: #fafbfc;
  border-radius: 11px;
  padding: 11px;
}

.result-info span {
  font-size: 8.5px;
  color: var(--muted);
  display: block;
}

.result-info strong {
  font-size: 11px;
  display: block;
  margin-top: 4px;
}

.analysis-total {
  margin: 0 16px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}

.analysis-total .label {
  font-size: 10px;
  color: var(--muted);
}

.analysis-total .value {
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.03em;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}

.analysis-total .delta {
  margin-top: 7px;
  font-size: 11px;
}

.analysis-chart-card {
  margin: 0 16px;
  background: #fff;
  border-radius: var(--r-lg);
  padding: 18px;
  box-shadow: var(--shadow-sm);
}

.donut-wrap {
  display: flex;
  align-items: center;
  gap: 22px;
}

.donut {
  width: 112px;
  height: 112px;
  border-radius: 50%;
  background: conic-gradient(
    #c99629 0 48%,
    #354e71 48% 72%,
    #7fa6bd 72% 88%,
    #d8dee7 88% 100%
  );
  position: relative;
  flex: none;
}

.donut::after {
  content: "";
  position: absolute;
  inset: 21px;
  border-radius: 50%;
  background: #fff;
}

.donut .center {
  position: absolute;
  inset: 0;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  color: var(--muted);
}

.donut .center strong {
  display: block;
  font-size: 14px;
  color: var(--ink);
  margin-bottom: 2px;
}

.legend {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

.legend-row {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 10px;
  color: #666f7d;
}

.legend-row i {
  width: 7px;
  height: 7px;
  border-radius: 2px;
  flex: none;
}

.legend-row span {
  margin-left: auto;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}

.analysis-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 11px;
}

.analysis-row:last-child {
  border-bottom: 0;
}

.analysis-row span {
  color: var(--muted);
}

.analysis-row strong {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   STRUCTURED / STOCK DETAIL
   ============================================================ */
.structured-hero {
  margin: 0 16px;
  background:
    radial-gradient(circle at 86% 15%, rgba(232, 196, 116, 0.24), transparent 33%),
    linear-gradient(140deg, #22354f, #152438);
  color: #fff;
  border-radius: var(--r-xl);
  padding: 20px;
  box-shadow: 0 18px 38px rgba(20, 37, 58, 0.18);
}

.structured-hero .st-tag {
  display: inline-flex;
  gap: 5px;
  margin-bottom: 10px;
}

.structured-hero h1 {
  margin: 0;
  font-size: 20px;
  line-height: 1.4;
  font-weight: 650;
}

.structured-hero .st-code {
  margin-top: 5px;
  color: rgba(255, 255, 255, 0.46);
  font-size: 9px;
  font-family: "SF Mono", "Menlo", monospace;
}

.structured-hero .st-metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 20px;
  padding-top: 15px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
}

.structured-hero .st-metrics strong {
  font-size: 18px;
  font-weight: 650;
  color: #f1d692;
}

.structured-hero .st-metrics span {
  display: block;
  font-size: 8.5px;
  color: rgba(255, 255, 255, 0.5);
  margin-top: 4px;
}

.underlying-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 11px 0;
  border-bottom: 1px solid var(--line);
}

.underlying-row:last-child {
  border-bottom: 0;
}

.underlying-row .u-logo {
  width: 29px;
  height: 29px;
  border-radius: 8px;
  background: #111;
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 12px;
  flex: none;
}

.underlying-row strong {
  font-size: 11.5px;
}

.underlying-row span {
  display: block;
  color: var(--muted);
  font-size: 9px;
  margin-top: 2px;

    const route = {
      name: segments[0] || "home",
      id: segments[1] ? decodeURIComponent(segments[1]) : null,
      query: Object.fromEntries(new URLSearchParams(queryPart || "")),

    return route;

    return Number(n).toLocaleString("en-US", {

    const num = Number(n);

  function navigate(path, opts = {}) {
    if (!path) return;
    const hash = path.startsWith("#") ? path : `#/${path}`;
    if (location.hash === hash) {
      render();
      return;
    }
    if (opts.replace) {
      routeStack = [{ ...parseRoute() }];
      try { history.replaceState({ depth: 1 }, "", hash); routeStack = [{ ...parseRoute() }]; }
      catch { location.hash = hash; }
    } else {
      routeStack.push({ ...parseRoute() });
      try { history.pushState({ depth: routeStack.length }, "", hash); }
      catch { location.hash = hash; }
    }
    state.route = parseRoute();
    render();
  }

    if (routeStack.length > 1) {

  function chartGeometry(data, width = 340, height = 150, padX = 8, padY = 14) {
    const min = Math.min(...data);
    const max = Math.max(...data);
    const span = max - min || 1;
    const pts = data.map((v, i) => {
      const x = padX + (i * (width - padX * 2)) / Math.max(1, data.length - 1);
      const y = padY + (1 - (v - min) / span) * (height - padY * 2);
      return [x, y];
    });
    const line = pts
      .map((pt, i) => `${i === 0 ? "M" : "L"}${pt[0].toFixed(2)} ${pt[1].toFixed(2)}`)
      .join(" ");
    const area = `${line} L${width - padX} ${height} L${padX} ${height} Z`;
    return { line, area, pts, min, max };
  }

  let chartUid = 0;

  function sparkline(data, color = "#0c9f6e", className = "spark") {
    if (!data || !data.length) return "";
    const w = 100;
    const h = 28;
    const g = chartGeometry(data, w, h, 1, 4);
    const id = `sp-${++chartUid}`;
    return `<svg class="${className}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".16"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      <path d="${g.area}" fill="url(#${id})"/>
      <path d="${g.line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>`;
  }

  function bigChart(data, color = "#c8942b", showAxis = true) {
    if (!data || !data.length) {
      return `<div class="chart-empty">暂无净值走势数据</div>`;
    }
    const w = 360;
    const h = 154;
    const g = chartGeometry(data, w, h, 8, 12);
    const id = `big-${++chartUid}`;
    const grid = [0.2, 0.48, 0.76].map((r) => {
      const y = h * r;
      return `<line x1="8" y1="${y}" x2="${w - 8}" y2="${y}" stroke="#eef1f4" stroke-width="1" stroke-dasharray="2 4"/>`;
    }).join("");
    const last = g.pts[g.pts.length - 1];
    const maxLabel = "";
    const minLabel = "";
    return `<svg class="big-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".2"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      ${grid}
      <path d="${g.area}" fill="url(#${id})"/>
      <path d="${g.line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <line x1="${last[0] - 16}" y1="${last[1]}" x2="${w - 8}" y2="${last[1]}" stroke="${color}" stroke-width=".7" stroke-dasharray="2 3" opacity=".45"/>
      <circle cx="${last[0]}" cy="${last[1]}" r="3.2" fill="#fff" stroke="${color}" stroke-width="2"/>
      ${maxLabel}${minLabel}
    </svg>`;
  }

      list = EMPTY_MARKET_NEWS;

      list = NEWS.filter((n) => (active === "要闻" ? true : n.market === tabFilter));

    return `<div class="page page--with-nav">
      ${topbar("资讯")}

  function applyFundFilters(list) {
    return list.filter((f) => {
      if (state.fundFilter.type !== "all" && f.type !== state.fundFilter.type) return false;
      if (state.fundFilter.risk !== "all" && f.risk !== state.fundFilter.risk) return false;
      if (state.fundFilter.min !== "all") {
        const limit = { "1000": 1000, "10000": 10000, "50000": 50000 }[state.fundFilter.min] || 0;
        if (f.min > limit) return false;
      }
      return true;
    });
  }

  function searchBody(query) {
    const q = query.trim();
    if (!q) {
      return `<div class="search-block">
        <h3>热门搜索</h3>
        <div class="search-tags">${HOT_SEARCHES.map((h) => `<button class="chip" data-action="search-hot" data-q="${h}">${h}</button>`).join("")}</div>
        <h3 style="margin-top:24px">最近搜索</h3>
        <div class="section-card" style="padding:2px 14px;box-shadow:none;border:1px solid var(--line)">
          ${state.recentSearches.map((r) => `<button class="recent-row" data-action="search-hot" data-q="${esc(r)}" style="width:100%;text-align:left">${icon("clock")}<span>${esc(r)}</span>${icon("chevronRight")}</button>`).join("")}
        </div>
        <h3 style="margin-top:24px">按类别浏览</h3>
        <div class="search-tags">
          <button class="chip" data-action="go-products" data-tab="public">公募基金</button>
          <button class="chip" data-action="go-products" data-tab="private">私募基金</button>
          <button class="chip" data-action="go-products" data-tab="structured">结构化产品</button>
          <button class="chip" data-nav="#/products">全部产品</button>
        </div>
      </div>`;
    }
    const needle = q.toLowerCase();
    const fundResults = FUNDS.filter((f) => `${f.name} ${f.code} ${f.isin} ${f.type}`.toLowerCase().includes(needle));
    const structuredResults = STRUCTURED.filter((p) => `${p.name} ${p.code} ${p.underlying}`.toLowerCase().includes(needle));
    const count = fundResults.length + structuredResults.length;
    if (!count) {
      return `<div class="product-empty" style="margin-top:18px"><div class="empty-icon">${icon("search")}</div><h3>没有找到“${esc(q)}”</h3><p>试试搜索基金名称、代码或产品关键词</p></div>`;
    }
    return `<div class="search-block" style="padding-top:2px">
      <div class="small muted" style="padding:0 2px 10px">找到 ${count} 个相关产品</div>
      ${fundResults.length ? `<div class="search-result">${fundResults.map((f) => `<button class="fund-list-row" data-nav="#/fund/${f.id}" style="width:100%;text-align:left"><div class="fund-list-name"><strong>${esc(f.name)}</strong><p>${tag(f.currency)}<span class="product-code">${esc(f.code)}</span>${tag(f.type)}</p></div><div class="fund-list-num ${signClass(f.y1)}">${signedPct(f.y1)}<span>近一年</span></div></button>`).join("")}</div>` : ""}
      ${structuredResults.length ? `<div class="search-result" style="margin-top:12px">${structuredResults.map((p) => `<button class="fund-list-row" data-nav="#/structured/${p.id}" style="width:100%;text-align:left"><div class="fund-list-name"><strong>${esc(p.name)}</strong><p>${tag(p.currency, "gold")}${tag("结构化", "blue")}</p></div><div class="fund-list-num">${p.annual.toFixed(2)}%<span>年化票息</span></div></button>`).join("")}</div>` : ""}
    </div>`;
  }

  /* ----------------------------------------------------------

     ---------------------------------------------------------- */
  function getRiskResult() {
    const score = state.risk.answers.reduce((s, v) => s + (Number(v) + 1), 0);
    if (score <= 4) return { name: "保守型", level: 1, desc: "您更看重本金安全与流动性，建议以货币基金、短久期固收类产品为主，控制权益类资产比例。", scale: 1 };
    if (score <= 8) return { name: "稳健型", level: 2, desc: "您能够承受适度波动，建议以固收打底、均衡配置为主，适度参与优质权益资产。", scale: 2 };
    if (score <= 12) return { name: "成长型", level: 3, desc: "您具备较好的风险承受能力，可考虑提高权益类与多资产组合的配置比例，追求长期资本增值。", scale: 4 };
    return { name: "激进型", level: 4, desc: "您能够接受较大幅度的净值波动，可关注成长型权益、行业主题及结构化产品，并做好仓位与风险管理。", scale: 5 };
  }

  function pageRisk() {
    const r = state.risk;
    if (!r.started) {
      return `<div class="page">
        ${detailBar("风险测评")}

          <section class="risk-intro">
            <div class="shield">${icon("shield")}</div>

            <p>用 4 个问题评估您的风险承受能力，帮助我们为您匹配更合适的产品。</p>
          </section>
          <section class="section-card">
            <div class="info-head"><h3>测评须知</h3><span class="tag tag--gold">约 1 分钟</span></div>
            <div class="detail-list" style="margin:10px 0 0;padding:0;box-shadow:none">
              <div class="row"><span>题目数量</span><strong>4 题</strong></div>
              <div class="row"><span>结果有效期</span><strong>12 个月</strong></div>
              <div class="row"><span>用途</span><strong>产品适当性匹配</strong></div>

    }
