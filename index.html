        <button class="watch-large ${watched ? "is-on" : ""}" data-action="toggle-watch" data-id="${fund.id}">${icon("heart")}<span>${watched ? "已自选" : "自选"}</span></button>
        ${holding ? `<button class="btn secondary" data-action="open-redeem" data-id="${fund.id}">赎回</button>` : ""}
        ${fund.nav ? `<button class="btn btn--primary" data-action="open-buy" data-id="${fund.id}">${holding ? "加仓申购" : "申购"}</button>` : `<button class="btn btn--primary" data-action="toast" data-msg="该基金尚在募集期，暂不支持申购">预约认购</button>`}
      </div>`;
    }
    if (route.name === "structured") {
      const p = STRUCTURED_MAP[route.id] || STRUCTURED[0];
      return `<div class="actionbar">
        <button class="watch-large" data-action="toast" data-msg="产品文件 · PDF 演示">${icon("doc")}<span>文件</span></button>
        <button class="btn btn--primary" data-action="open-structured" data-id="${p.id}">立即认购</button>
      </div>`;
    }
    if (route.name === "stock") {
      const s = getStock(route.id) || MARKET_DATA.hk.indices[0];
      const watched = state.watchlist.includes(s.id);
      return `<div class="actionbar">
        <button class="watch-large ${watched ? "is-on" : ""}" data-action="toggle-watch" data-id="${s.id}">${icon("heart")}<span>${watched ? "已自选" : "自选"}</span></button>
        <button class="btn btn--ghost" style="flex:0 0 95px" data-action="toast" data-msg="模拟卖出 · 演示入口">卖出</button>
        <button class="btn btn--primary" data-action="toast" data-msg="模拟买入 · 演示入口">买入</button>
      </div>`;
    }
    if (route.name === "order") {
      const order = state.orders.find((o) => o.id === route.id);
      if (order && (order.status.includes("待确认") || order.status.includes("已提交"))) {
        return `<div class="actionbar">
          <button class="btn btn--ghost" style="flex:0 0 115px" data-action="cancel-order" data-id="${order.id}">取消订单</button>
          <button class="btn btn--primary" data-action="reorder" data-id="${order.id}">再买一笔</button>
        </div>`;
      }
    }
    return "";
  }

  /* ----------------------------------------------------------
     Render
     ---------------------------------------------------------- */
  let lastRenderKey = "";
  let lastScroll = 0;
  let forceScrollTop = false;
  const app = document.getElementById("app");

  function getActiveRoot() {
    const r = parseRoute();
    if (r.id) return "";
    return ROOT_TABS.some((t) => t.name === r.name) ? r.name : "";
  }

  function render() {
    const route = parseRoute();
    const key = routeKey(route);
    const keepScroll = !forceScrollTop && key === lastRenderKey && !["success"].includes(route.name);
    const oldViewport = document.getElementById("viewport");
    const samePage = Boolean(oldViewport) && key === lastRenderKey;
    const overlayWasOpen = Boolean(document.querySelector(".overlay"));
    if (oldViewport) lastScroll = oldViewport.scrollTop;

    const page = pageFor(route);
    const actionbar = actionbarFor(route);
    const nav = getActiveRoot() ? bottomNav(route.name) : "";
    app.innerHTML = `${statusbar()}
      <div class="viewport" id="viewport">${page}</div>
      ${actionbar}
      ${nav}
      ${renderOverlay()}`;

    lastRenderKey = key;
    forceScrollTop = false;
    const newViewport = document.getElementById("viewport");
    if (newViewport) {
      newViewport.scrollTop = keepScroll ? lastScroll : 0;
    }
    if (route.name === "products") {
      const tabsEl = document.querySelector(".product-tabs");
      const activeTab = tabsEl && tabsEl.querySelector(".product-tab.is-active");
      if (tabsEl && activeTab) {
        const tabsRect = tabsEl.getBoundingClientRect();
        const activeRect = activeTab.getBoundingClientRect();
        const offscreen = activeRect.left < tabsRect.left + 8 || activeRect.right > tabsRect.right - 8;
        if (offscreen) {
          const target = tabsEl.scrollLeft + activeRect.left - tabsRect.left - (tabsEl.clientWidth - activeRect.width) / 2;
          tabsEl.scrollLeft = Math.max(0, target);
        }
      }
    }
    if (samePage) {
      app.querySelector(".page")?.classList.add("no-enter");
    }
    if (overlayWasOpen) {
      const overlay = app.querySelector(".overlay");
      if (overlay) {
        overlay.classList.add("no-enter");
        overlay.querySelector(".sheet")?.classList.add("no-enter");
      }
    }
    if (route.name === "search") {
      requestAnimationFrame(() => {
        const input = document.getElementById("search-input");
        if (input && !input.value) input.focus({ preventScroll: true });
      });
    }
  }

  /* ----------------------------------------------------------
     Navigation / actions
     ---------------------------------------------------------- */
  function openOptions(key, title, options, active) {
    state.sheet = { type: "options", key, title, options, active };
    render();
  }

  function filterOptions(key) {
    if (key === "type") {
      openOptions("fundType", "基金类型", [{ label: "全部类型", value: "all" }, { label: "股票型", value: "股票型" }, { label: "混合型", value: "混合型" }, { label: "货币型", value: "货币型" }], state.fundFilter.type);
    } else if (key === "risk") {
      openOptions("fundRisk", "风险等级", [{ label: "全部风险", value: "all" }, { label: "低风险", value: "低风险" }, { label: "中风险", value: "中风险" }, { label: "中高风险", value: "中高风险" }, { label: "高风险", value: "高风险" }], state.fundFilter.risk);
    } else {
      openOptions("fundMin", "起投金额", [{ label: "全部金额", value: "all" }, { label: "1,000 以下", value: "1000" }, { label: "10,000 以下", value: "10000" }, { label: "50,000 以下", value: "50000" }], state.fundFilter.min);
    }
  }

  function orderFilterOptions(key) {
    if (key === "fund") {
      const ids = [...new Set(state.orders.map((o) => o.fundId))];
      const options = [{ label: "全部基金", value: "all" }].concat(ids.map((id) => ({ label: getFund(id)?.name || state.orders.find((o) => o.fundId === id)?.name || id, value: id })));
      openOptions("orderFund", "选择基金", options, state.orderFilter.fund);
    } else {
      openOptions("orderType", "订单类型", [{ label: "全部类型", value: "all" }, { label: "申购", value: "申购" }, { label: "赎回", value: "赎回" }, { label: "认购", value: "认购" }], state.orderFilter.type);
    }
  }

  function openBuy(fundId) {
    const fund = getFund(fundId);
    if (!fund) return;
    if (!fund.nav) {
      showToast("该基金尚在募集期，暂不支持申购");
      return;
    }
    state.sheet = { type: "buy", fundId, amount: fund.min ? String(fund.min) : "10000", agreed: false };
    render();
  }

  function openRedeem(fundId) {
    const holding = getHolding(fundId);
    if (!holding) {
      showToast("暂无可赎回份额");
      return;
    }
    state.sheet = { type: "redeem", fundId, shares: String(holding.shares), agreed: false };
    render();
  }

  function openStructured(productId) {
    const p = STRUCTURED_MAP[productId];
    if (!p) return;
    state.sheet = { type: "structured", productId, amount: String(p.min), agreed: false };
    render();
  }

  function openPin(title, subtitle, cb) {
    pendingPinAction = cb;
    state.pin = { title, subtitle, digits: "" };
    render();
  }

  function closeOverlay() {
    state.pin = null;
    pendingPinAction = null;
    state.sheet = null;
    render();
  }

  function applyOption(key, value) {
    if (key === "fundType") state.fundFilter.type = value;
    else if (key === "fundRisk") state.fundFilter.risk = value;
    else if (key === "fundMin") state.fundFilter.min = value;
    else if (key === "orderFund") state.orderFilter.fund = value;
    else if (key === "orderType") state.orderFilter.type = value;
    else if (key === "exchangeFrom") state.exchange.from = value;
    else if (key === "exchangeTo") state.exchange.to = value;
    else if (key === "withdrawCurrency") state.withdraw.currency = value;
    state.sheet = null;
    saveState();
    render();
  }

  function createOrder({ fundId, name, code, type, amount, fee = 0, shares = 0, currency = "HKD" }) {
    return {
      id: `ord-${Date.now()}`,
      fundId,
      name,
      code,
      type,
      status: "已下单待确认",
      amount,
      fee,
      shares,
      currency,
      date: nowText(),
      orderNo: makeOrderNo(type === "认购" ? "STR" : "FUND"),
    };
  }

  function confirmBuy() {
    const s = state.sheet;
    if (!s) return;
    const fund = getFund(s.fundId);
    const amount = Number(s.amount);
    if (!amount || amount <= 0) {
      showToast("请输入有效的申购金额");
      return;
    }
    if (fund.min && amount < fund.min) {
      showToast(`最低申购金额为 ${money(fund.min, 0)} ${fund.currency}`);
      return;
    }
    if (!s.agreed) {
      showToast("请先阅读并同意相关协议");
      return;
    }
    state.sheet = null;
    openPin("请输入交易密码", `申购 ${fund.name}`, () => {
      const order = createOrder({
        fundId: fund.id,
        name: fund.name,
        code: fund.code,
        type: "申购",
        amount,
        fee: 0,
        currency: fund.currency,
      });
      state.orders.unshift(order);
      state.successData = {
        kind: "buy",
        title: "申购委托已提交",
        subtitle: "待基金公司确认份额，确认后将更新持仓",
        rows: [
          ["基金名称", fund.name],
          ["申购金额", `${fund.currency} ${money(amount)}`],
          ["预计份额", `${money(amount / fund.nav, 4)} 份`],
          ["订单状态", "已下单待确认"],
          ["订单号", order.orderNo],
        ],
      };
      saveState();
      navigate("#/success");
    });
  }

  function confirmRedeem() {
    const s = state.sheet;
    if (!s) return;
    const fund = getFund(s.fundId);
    const holding = getHolding(s.fundId);
    const shares = Number(s.shares);
    if (!holding || !shares || shares <= 0) {
      showToast("请输入有效的赎回份额");
      return;
    }
    if (shares > holding.shares + 0.000001) {
      showToast("赎回份额不能超过可用份额");
      return;
    }
    if (!s.agreed) {
      showToast("请先确认赎回相关提示");
      return;
    }
    state.sheet = null;
    openPin("请输入交易密码", `赎回 ${fund.name}`, () => {
      const amount = shares * fund.nav;
      const order = createOrder({
        fundId: fund.id,
        name: fund.name,
        code: fund.code,
        type: "赎回",
        amount,
        fee: 0,
        shares,
        currency: fund.currency,
      });
      state.orders.unshift(order);
      holding.shares = Math.max(0, holding.shares - shares);
      if (holding.shares <= 0.0001) {
        state.holdings = state.holdings.filter((h) => h.fundId !== fund.id);
      }
      state.successData = {
        kind: "redeem",
        title: "赎回申请已提交",
        subtitle: "申请已受理，等待基金公司确认",
        rows: [
          ["基金名称", fund.name],
          ["赎回份额", `${money(shares, 4)} 份`],
          ["预计到账", `${fund.currency} ${money(amount)}`],
          ["订单状态", "已提交待确认"],
          ["订单号", order.orderNo],
        ],
      };
      saveState();
      navigate("#/success");
    });
  }

  function confirmStructured() {
    const s = state.sheet;
    if (!s) return;
    const p = STRUCTURED_MAP[s.productId];
    const amount = Number(s.amount);
    if (!p) return;

      const order = createOrder({

        name: p.name,
        code: p.code,
        type: "认购",
        amount,
        fee: 0,
        currency: p.currency,

        kind: "buy",
        title: "认购申请已提交",
        subtitle: "产品额度确认后将通知您完成后续流程",
        rows: [
          ["产品名称", p.name],
          ["认购金额", `${p.currency} ${money(amount)}`],

          ["订单号", order.orderNo],

          ["预计到账", "1–2 个工作日"],

          ["提款金额", `${w.currency} ${money(amount)}`],

          ["预计到账", "1–2 个工作日"],
          ["状态", "处理中"],

      };

  function submitExchange() {
    const e = state.exchange;
    const amount = Number(e.amount);
    if (!amount || amount <= 0) {
      showToast("请输入有效的兑换金额");
      return;
    }
    if (e.from === e.to) {
      showToast("请选择不同的兑换币种");
      return;
    }
    const rates = { "HKD-CNY": 0.912, "CNY-HKD": 1.0965, "HKD-USD": 0.1281, "USD-HKD": 7.806, "CNY-USD": 0.1404, "USD-CNY": 7.12 };
    const rate = rates[`${e.from}-${e.to}`] || 1;
    openPin("请输入交易密码", `兑换 ${e.from} ${money(amount)}`, () => {
      state.successData = {
        kind: "exchange",
        title: "兑换委托已提交",
        subtitle: "成交后将更新您的现金余额",
        rows: [
          ["兑换方向", `${e.from} → ${e.to}`],
          ["兑换金额", `${e.from} ${money(amount)}`],
          ["参考汇率", `1 ${e.from} = ${rate} ${e.to}`],
          ["预计所得", `${e.to} ${money(amount * rate)}`],
          ["状态", "处理中"],
        ],
      };
      state.exchange.amount = "";
      saveState();
      navigate("#/success");
    });
  }

  /* ----------------------------------------------------------
     Event handling
     ---------------------------------------------------------- */
  app.addEventListener("click", (event) => {
    if (event.target.classList.contains("overlay")) {
      closeOverlay();
      return;
    }

    const actionEl = event.target.closest("[data-action]");
    const navEl = event.target.closest("[data-nav]");

    // Interactive controls inside a clickable card should win over the card.
    if (!actionEl && navEl) {
      event.preventDefault();
      navigate(navEl.getAttribute("data-nav"));
      return;
    }
    if (!actionEl) return;

    const el = actionEl;
    const action = el.dataset.action;

    const stop = (fn) => {
      event.preventDefault();
      event.stopPropagation();
      fn();
    };

    switch (action) {
      case "back":
        goBack();
        break;
      case "open-search":
        navigate("#/search");
        break;
      case "open-mail":
        showToast("暂无新的消息");
        break;
      case "overlay-close":
        closeOverlay();
        break;
      case "close-sheet":
        closeOverlay();
        break;
      case "toast":
        showToast(el.dataset.msg || "演示入口");
        break;
      case "go-products":
        goProducts(el.dataset.tab);
        break;
      case "toggle-amount":
        state.hideAmounts = !state.hideAmounts;
        saveState();
        render();
        break;
      case "account-tab":
        state.accountTab = el.dataset.tab;
        forceScrollTop = true;
        render();
        break;
      case "toggle-group":
        state.openGroups[el.dataset.key] = !state.openGroups[el.dataset.key];
        saveState();
        render();
        break;
      case "product-tab":
        state.productsTab = el.dataset.tab;
        saveState();
        forceScrollTop = true;
        render();
        break;
      case "news-tab":
        state.newsTab = el.dataset.tab;
        if (el.dataset.tab === "看美股") state.newsFilter = "美股";
        if (el.dataset.tab === "看中国") state.newsFilter = "A股";
        if (el.dataset.tab === "快讯") state.newsFilter = "港股";
        saveState();
        forceScrollTop = true;
        render();
        break;
      case "news-filter":
        state.newsFilter = el.dataset.filter;
        if (["看美股", "看中国", "日历", "自选"].includes(state.newsTab)) state.newsTab = "快讯";
        saveState();
        forceScrollTop = true;
        render();
        break;
      case "fund-tab":
        state.fundDetailTab = el.dataset.tab;
        render();
        break;
      case "fund-period":
        state.fundPeriod = el.dataset.period;
        render();
        break;
      case "toggle-watch":
        toggleWatch(el.dataset.id);
        break;
      case "open-buy":
        openBuy(el.dataset.id);
        break;
      case "open-redeem":
        openRedeem(el.dataset.id);
        break;
      case "open-structured":
        openStructured(el.dataset.id);
        break;
      case "buy-quick":
        state.sheet.amount = el.dataset.amount;
        render();
        break;
      case "structured-quick":
        state.sheet.amount = el.dataset.amount;
        render();
        break;
      case "redeem-pct": {
        const h = getHolding(state.sheet.fundId);
        const pct = Number(el.dataset.pct);
        state.sheet.shares = (h.shares * (pct / 100)).toFixed(4);
        render();
        break;
      }
      case "redeem-all": {
        const h = getHolding(state.sheet.fundId);
        state.sheet.shares = String(h.shares);
        render();
        break;
      }
      case "toggle-agree":
      case "toggle-redeem-agree":
      case "toggle-structured-agree":
        state.sheet.agreed = !state.sheet.agreed;
        el.querySelector(".check")?.classList.toggle("is-on", state.sheet.agreed);
        break;
      case "confirm-buy":
        confirmBuy();
        break;
      case "confirm-redeem":
        confirmRedeem();
        break;
      case "confirm-structured":
        confirmStructured();
        break;
      case "pin-key":
        if (!state.pin) break;
        if (state.pin.digits.length < 6) {
          state.pin.digits += el.dataset.key;
          updatePinUI();
        }
        break;
      case "pin-del":
        if (state.pin) {
          state.pin.digits = state.pin.digits.slice(0, -1);
          updatePinUI();
        }
        break;
      case "pin-confirm": {
        if (!state.pin) break;
        if (state.pin.digits.length !== 6) {
          const dots = document.getElementById("pin-dots");
          if (dots) {
            dots.classList.remove("shake");
            void dots.offsetWidth;
            dots.classList.add("shake");
          }
          showToast("请输入 6 位交易密码");
          break;
        }
        const cb = pendingPinAction;
        state.pin = null;
        pendingPinAction = null;
        if (cb) cb();
        else render();
        break;
      }
      case "pin-close":
        state.pin = null;
        pendingPinAction = null;
        render();
        break;
      case "success-done":
        state.successData = null;
        navigate("#/home");
        break;
      case "filter":
        filterOptions(el.dataset.key);
        break;
      case "order-filter":
        orderFilterOptions(el.dataset.key);
        break;
      case "pick-option":
        applyOption(state.sheet.key, el.dataset.value);
        break;
      case "search-hot": {
        const q = el.dataset.q;
        state.searchQuery = q;
        if (!state.recentSearches.includes(q)) {
          state.recentSearches.unshift(q);
          state.recentSearches = state.recentSearches.slice(0, 5);
        }
        saveState();
        render();
        requestAnimationFrame(() => {
          const input = document.getElementById("search-input");
          if (input) {
            input.value = q;
            input.focus({ preventScroll: true });
            input.setSelectionRange(q.length, q.length);
          }
          const body = document.getElementById("search-body");
          if (body) body.innerHTML = searchBody(q);
        });
        break;
      }
      case "search-clear":
        state.searchQuery = "";
        render();
        requestAnimationFrame(() => document.getElementById("search-input")?.focus({ preventScroll: true }));
        break;
      case "deposit-currency":
        state.deposit.currency = el.dataset.currency;
        saveState();
        render();
        break;
      case "deposit-quick":
        state.deposit.amount = el.dataset.amount;
        saveState();
        render();
        break;
      case "deposit-next": {
        const amt = Number(state.deposit.amount);
        if (!amt || amt < 100) {
          showToast("请输入不低于 100 的入金金额");
          break;
        }
        state.deposit.step = 2;
        saveState();
        render();
        break;
      }
      case "deposit-back":
        state.deposit.step = 1;
        render();
        break;
      case "deposit-submit":
        submitDeposit();
        break;
      case "withdraw-currency":
        state.withdraw.currency = el.dataset.currency;
        saveState();
        render();
        break;
      case "withdraw-quick":
        state.withdraw.amount = el.dataset.amount;
        saveState();
        render();
        break;
      case "withdraw-all":
        state.withdraw.amount = state.withdraw.currency === "HKD" ? "4851219.28" : "100000";
        saveState();
        render();
        break;
      case "withdraw-submit":
        submitWithdraw();
        break;
      case "exchange-pick": {
        const side = el.dataset.side;
        const options = ["HKD", "CNY", "USD"].filter((c) => c !== (side === "from" ? state.exchange.to : state.exchange.from)).map((c) => ({ label: { HKD: "港币 HKD", CNY: "人民币 CNY", USD: "美元 USD" }[c], value: c }));
        openOptions(side === "from" ? "exchangeFrom" : "exchangeTo", side === "from" ? "选择卖出币种" : "选择买入币种", options, side === "from" ? state.exchange.from : state.exchange.to);
        break;
      }
      case "exchange-switch":
        [state.exchange.from, state.exchange.to] = [state.exchange.to, state.exchange.from];
        state.exchange.amount = "";
        saveState();
        render();
        break;
      case "exchange-quick":
        state.exchange.amount = el.dataset.amount;
        saveState();
        render();
        break;
      case "exchange-submit":
        submitExchange();
        break;
      case "risk-start":
        state.risk = { started: true, step: 0, answers: [], done: false };
        saveState();
        render();
        break;
      case "risk-answer": {
        const i = Number(el.dataset.index);
        state.risk.answers[state.risk.step] = i;
        if (state.risk.step >= RISK_QUESTIONS.length - 1) {
          state.risk.done = true;
        } else {
          state.risk.step += 1;
        }
        saveState();
        render();
        break;
      }
      case "risk-reset":
        state.risk = { started: true, step: 0, answers: [], done: false };
        saveState();
        render();
        break;
      case "risk-finish":
        navigate("#/mine");
        break;
      case "reset-demo":
        try { localStorage.removeItem(STORAGE_KEY); } catch { /* noop */ }
        state = cloneDefault();
        state.route = { name: "home", id: null, query: {} };
        history.replaceState({ depth: 1 }, "", "#/home");
        routeStack = [{ name: "home", id: null, query: {} }];
        render();
        showToast("演示数据已重置");
        break;
      case "copy": {
        const text = el.dataset.copy || "";
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => showToast("已复制账号")).catch(() => showToast("账号：" + text));
        } else {
          showToast("账号：" + text);
        }
        break;
      }
      case "cancel-order": {
        const id = el.dataset.id;
        const order = state.orders.find((o) => o.id === id);
        if (!order) break;
        order.status = "已撤销";
        saveState();
        render();
        showToast("订单已撤销");
        break;
      }
      case "reorder": {
        const order = state.orders.find((o) => o.id === el.dataset.id);
        if (!order) break;
        if (order.fundId && getFund(order.fundId)) openBuy(order.fundId);
        else if (order.fundId && STRUCTURED_MAP[order.fundId]) openStructured(order.fundId);
        else showToast("请前往产品页重新选择");
        break;
      }
      default:
        break;
    }
  });

  app.addEventListener("input", (event) => {
    const t = event.target;
    if (t.id === "search-input") {
      state.searchQuery = t.value;
      const body = document.getElementById("search-body");
      if (body) body.innerHTML = searchBody(t.value);
    } else if (t.id === "buy-amount") {
      state.sheet.amount = t.value;
      updateBuySheet();
    } else if (t.id === "redeem-shares") {
      state.sheet.shares = t.value;
      updateRedeemSheet();
    } else if (t.id === "structured-amount") {
      state.sheet.amount = t.value;
      const p = STRUCTURED_MAP[state.sheet.productId];
      const total = document.getElementById("structured-total");
      if (total) total.textContent = `${p.currency} ${money(Number(t.value) || 0)}`;
    } else if (t.id === "deposit-amount") {
      state.deposit.amount = t.value;
    } else if (t.id === "withdraw-amount") {
      state.withdraw.amount = t.value;
    } else if (t.id === "exchange-amount") {
      state.exchange.amount = t.value;
      const e = state.exchange;
      const rates = { "HKD-CNY": 0.912, "CNY-HKD": 1.0965, "HKD-USD": 0.1281, "USD-HKD": 7.806, "CNY-USD": 0.1404, "USD-CNY": 7.12 };
      const est = document.getElementById("exchange-estimate");
      if (est) est.textContent = `${e.to} ${money((Number(t.value) || 0) * (rates[`${e.from}-${e.to}`] || 1))}`;
    }
  });

  app.addEventListener("keydown", (event) => {
    if (event.target.id === "search-input" && event.key === "Enter") {
      const q = event.target.value.trim();
      if (q && !state.recentSearches.includes(q)) {
        state.recentSearches.unshift(q);
        state.recentSearches = state.recentSearches.slice(0, 5);
        saveState();
      }
      event.target.blur();
    }
    if (event.target.id === "buy-amount" && event.key === "Enter") {
      event.target.blur();
    }
  });

  function updatePinUI() {
    if (!state.pin) return;
    const dots = document.querySelectorAll(".pin-dot");
    dots.forEach((dot, i) => dot.classList.toggle("is-filled", i < state.pin.digits.length));
    const confirm = document.querySelector(".pin-confirm");
    if (confirm) confirm.disabled = state.pin.digits.length !== 6;
  }

  function updateBuySheet() {
    if (!state.sheet || state.sheet.type !== "buy") return;
    const fund = getFund(state.sheet.fundId);
    const amount = Number(state.sheet.amount) || 0;
    const shares = fund.nav ? amount / fund.nav : 0;
    const sharesEl = document.getElementById("buy-shares");
    const totalEl = document.getElementById("buy-total");
    if (sharesEl) sharesEl.textContent = `${money(shares, 4)} 份`;
    if (totalEl) totalEl.textContent = `HKD ${money(amount)}`;
  }

  function updateRedeemSheet() {
    if (!state.sheet || state.sheet.type !== "redeem") return;
    const fund = getFund(state.sheet.fundId);
    const shares = Number(state.sheet.shares) || 0;
    const totalEl = document.getElementById("redeem-total");
    if (totalEl) totalEl.textContent = `HKD ${money(shares * fund.nav)}`;
  }

  /* ----------------------------------------------------------
     Boot
     ---------------------------------------------------------- */
  try {
    history.replaceState({ depth: 1 }, "", location.hash || "#/home");
  } catch {
    /* file:// previews may restrict history access */
  }
  routeStack = [parseRoute()];
  state.route = { ...routeStack[0] };

  window.addEventListener("popstate", (event) => {
    const r = parseRoute();
    state.route = r;
    const depth = event.state && typeof event.state.depth === "number" ? event.state.depth : 1;
    routeStack = routeStack.slice(0, Math.max(1, depth));
    render();
  });

  // Fallback for environments where history is restricted (e.g. some file:// previews).
  window.addEventListener("hashchange", () => {
    const r = parseRoute();
    if (routeKey(r) !== routeKey(state.route)) {
      state.route = r;
      render();
    }
  });

  render();
})();

  </script>
</body>
</html>
